<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Placas Automático</title>
<style>
:root{--bg:#eceae4;--card:#fff;--ink:#1d2430;--mute:#6b7280;--in:#1f7a4d;--out:#c2571a;--line:#d6d3ca;--plate:#f6c515}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1e242e;--ink:#eef0f3;--mute:#98a1ae;--in:#4cc38a;--out:#f08b4e;--line:#2f3844}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px} h2{font-size:16px;margin:20px 0 8px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{cursor:pointer}
.big{width:100%;padding:16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;margin-top:14px}
.ghost{padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.pt{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-bottom:6px}
.pt button{border:0;background:none;color:var(--mute);font-size:22px}
.hint{color:var(--mute);font-size:14px}
.tag{font-weight:700;font-size:13px;padding:3px 8px;border-radius:6px;color:#fff;display:inline-block}
.tag.entrada{background:var(--in)}.tag.salida{background:var(--out)}
#run{display:none;position:fixed;inset:0;background:#000;color:#fff;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top b{font-size:18px}
.cam{position:relative;flex:1;min-height:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:10%;right:10%;top:36%;height:28%;border:3px solid var(--plate);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:border-color .2s}
.guide.ok{border-color:#4cc38a;border-width:6px}
.bot{padding:10px 14px;background:#111}
.bot p{margin:0 0 6px;color:#c4c9d1;font-size:14px}
.last{font:800 22px "Arial Narrow",sans-serif;letter-spacing:.08em;margin:0 0 8px;color:#4cc38a}
.last small{font:14px system-ui;color:#98a1ae;letter-spacing:0;margin-left:8px}
.bot .row{display:flex;gap:8px}.bot .ghost{flex:1;background:#222;color:#fff;border-color:#333}
</style>
</head>
<body>
<main id="setup">
  <h1>Puntos de Control Automático</h1>

  <h2>1. Credenciales de la API</h2>
  <label for="token">API Token de Plate Recognizer</label>
  <input id="token" placeholder="Pega tu token aquí" type="password">

  <h2>2. Configurar Puntos de Control</h2>
  <div id="pts"></div>
  <button class="ghost" id="addPt">+ Agregar punto</button>

  <h2>3. Filtros opcionales</h2>
  <label for="country">Código de país / región</label>
  <input id="country" placeholder="co (Colombia), mx, us, etc." autocapitalize="lowercase">

  <h2>4. ¿Qué punto es este teléfono?</h2>
  <select id="me"></select>
  <button class="big" id="go">Iniciar Modo Automático</button>
  <button class="ghost" id="exp" style="width:100%;margin-top:8px;background:#1f7a4d;color:#fff;font-weight:bold">Descargar Registro Local (Excel / CSV)</button>
</main>

<section id="run">
  <div class="top"><span class="tag" id="tg"></span><b id="nm"></b><span class="hint" id="count" style="margin-left:auto">0 registros</span></div>
  <div class="cam"><video id="v" playsinline muted></video><div class="guide" id="gd"></div></div>
  <div class="bot">
    <p id="st">Escaneando automáticamente…</p>
    <p class="last" id="last"></p>
    <div class="row">
      <button class="ghost" id="stop">Detener Lector</button>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let cfg = ls('cfg_auto', { token: '', country: 'co', me: 0, pts: [{ n: 'Entrada Principal', t: 'entrada' }, { n: 'Salida Principal', t: 'salida' }] });
let log = ls('log_auto', []);
let lastRegTime = {}; // Control de duplicados por tiempo

// ---------- Interfaz de Configuración ----------
function drawPts() {
  $('pts').innerHTML = '';
  cfg.pts.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pt';
    d.innerHTML = '<input aria-label="Nombre"><select aria-label="Tipo"><option value="entrada">Entrada</option><option value="salida">Salida</option></select><button aria-label="Quitar">×</button>';
    const [n, t, x] = d.children;
    n.value = p.n; t.value = p.t;
    n.oninput = () => { p.n = n.value; refresh(); };
    t.onchange = () => { p.t = t.value; refresh(); };
    x.onclick = () => { if (cfg.pts.length > 1) { cfg.pts.splice(i, 1); drawPts(); refresh(); } };
    $('pts').appendChild(d);
  });
  refresh();
}

function refresh() {
  cfg.token = $('token').value.trim();
  cfg.country = $('country').value.trim().toLowerCase();
  const keep = Math.min(cfg.me, cfg.pts.length - 1);
  $('me').innerHTML = cfg.pts.map((p, i) => '<option value="' + i + '">' + (p.n || 'Sin nombre').replace(/</g, '&lt;') + ' (' + p.t + ')</option>').join('');
  $('me').value = keep; cfg.me = keep;
  sv('cfg_auto', cfg);
}

$('addPt').onclick = () => { cfg.pts.push({ n: 'Punto ' + (cfg.pts.length + 1), t: 'entrada' }); drawPts(); };
$('token').value = cfg.token; $('country').value = cfg.country;
$('token').oninput = $('country').oninput = refresh;
$('me').onchange = () => { cfg.me = +$('me').value; sv('cfg_auto', cfg); };
drawPts();

// ---------- Registro Local & Descarga de Excel ----------
function register(placa) {
  const p = cfg.pts[cfg.me];
  const now = new Date();
  const row = {
    fecha: now.toLocaleDateString('es-CO'),
    hora: now.toLocaleTimeString('es-CO'),
    placa: placa,
    tipo: p.t.toUpperCase(),
    punto: p.n,
    timestamp: now.getTime()
  };
  log.unshift(row);
  log = log.slice(0, 5000); // Guardar hasta 5000 registros
  sv('log_auto', log);
  updateCounter();
}

function updateCounter() {
  $('count').textContent = log.length + ' registrados';
}
updateCounter();

$('exp').onclick = () => {
  if (!log.length) { alert('Aún no hay registros guardados.'); return; }
  const headers = ['Fecha', 'Hora', 'Placa', 'Movimiento (Entrada/Salida)', 'Nombre del Punto'];
  const rows = log.map(r => [r.fecha, r.hora, r.placa, r.tipo, r.punto].join(';'));
  const csvContent = '\ufeff' + [headers.join(';'), ...rows].join('\r\n');
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Registro_Placas_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

// ---------- Escaneo Automático Continuo ----------
let stream = null, running = false, busy = false, loopTimer = null;

$('go').onclick = async () => {
  refresh();
  if (!cfg.token) { alert('Ingresa tu API Token antes de iniciar.'); return; }
  
  const p = cfg.pts[cfg.me];
  $('tg').textContent = p.t === 'entrada' ? 'Entrada' : 'Salida'; 
  $('tg').className = 'tag ' + p.t; 
  $('nm').textContent = p.n;
  
  $('setup').style.display = 'none'; 
  $('run').style.display = 'flex';
  
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    $('v').srcObject = stream; 
    await $('v').play();
  } catch(e) { 
    alert('No se pudo acceder a la cámara.'); 
    return; 
  }

  running = true;
  $('st').textContent = 'Buscando vehículos…';
  autoScanLoop();
};

$('stop').onclick = () => {
  running = false;
  if (loopTimer) clearTimeout(loopTimer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  $('run').style.display = 'none'; 
  $('setup').style.display = 'block';
};

async function autoScanLoop() {
  if (!running) return;
  
  if (!busy) {
    busy = true;
    await captureAndAnalyze();
    busy = false;
  }
  
  // Reintenta/captura cada 1.5 segundos (1500 ms)
  loopTimer = setTimeout(autoScanLoop, 1500);
}

async function captureAndAnalyze() {
  const v = $('v');
  if (!v.videoWidth) return;

  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth; 
  canvas.height = v.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

  return new Promise((resolve) => {
    canvas.toBlob(async (blob) => {
      const formData = new FormData();
      formData.append('upload', blob);
      if (cfg.country) formData.append('regions', cfg.country);

      try {
        const res = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
          method: 'POST',
          headers: { 'Authorization': 'Token ' + cfg.token },
          body: formData
        });

        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const placa = data.results[0].plate.toUpperCase();
          const now = Date.now();

          // Evita volver a registrar la misma placa en menos de 60 segundos (60000 ms)
          if (!lastRegTime[placa] || (now - lastRegTime[placa] > 60000)) {
            lastRegTime[placa] = now;
            
            // 1. Guardar Registro
            register(placa);
            
            // 2. Feedback Visual y Táctil
            $('gd').classList.add('ok'); 
            setTimeout(() => $('gd').classList.remove('ok'), 1500);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            $('last').innerHTML = `¡CAPTURA EXITOSA: ${placa}! <small>${new Date().toLocaleTimeString('es-CO')}</small>`;
            $('st').textContent = 'Placa guardada localmente. Esperando siguiente vehículo…';
          } else {
            $('st').textContent = `Placa ${placa} ya registrada recientemente. Ignorando…`;
          }
        } else {
          $('st').textContent = 'Buscando vehículos…';
        }
      } catch(err) {
        $('st').textContent = 'Error de conexión / reintentando…';
      }
      resolve();
    }, 'image/jpeg', 0.85);
  });
}
</script>
</body>
</html>
