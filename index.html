<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Placas - Plate Recognizer API</title>
<style>
:root{--bg:#eceae4;--card:#fff;--ink:#1d2430;--mute:#6b7280;--in:#1f7a4d;--out:#c2571a;--line:#d6d3ca;--plate:#f6c515}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1e242e;--ink:#eef0f3;--mute:#98a1ae;--in:#4cc38a;--out:#f08b4e;--line:#2f3844}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px} h2{font-size:16px;margin:20px 0 8px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{cursor:pointer}
.big{width:100%;padding:16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;margin-top:14px}
.ghost{padding:11px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.pt{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-bottom:6px}
.pt button{border:0;background:none;color:var(--mute);font-size:22px}
.hint{color:var(--mute);font-size:14px}
.tag{font-weight:700;font-size:13px;padding:3px 8px;border-radius:6px;color:#fff;display:inline-block}
.tag.entrada{background:var(--in)}.tag.salida{background:var(--out)}
#run{display:none;position:fixed;inset:0;background:#000;color:#fff;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top b{font-size:18px}
.cam{position:relative;flex:1;min-height:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:10%;right:10%;top:36%;height:28%;border:3px solid var(--plate);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:border-color .2s}
.guide.ok{border-color:#4cc38a}
.bot{padding:10px 14px;background:#111}
.bot p{margin:0 0 6px;color:#c4c9d1;font-size:14px}
.last{font:800 22px "Arial Narrow",sans-serif;letter-spacing:.08em;margin:0 0 8px}
.last small{font:14px system-ui;color:#98a1ae;letter-spacing:0;margin-left:8px}
.bot .row{display:flex;gap:8px}.bot .ghost{flex:1;background:#222;color:#fff;border-color:#333}
</style>
</head>
<body>
<main id="setup">
  <h1>Puntos de control (Plate Recognizer API)</h1>

  <h2>1. Credenciales de la API</h2>
  <label for="token">API Token de Plate Recognizer</label>
  <input id="token" placeholder="Pega tu token aquí (Token xyz...)" type="password">
  <p class="hint">Regístrate gratis en platerecognizer.com para obtener tu Token.</p>

  <h2>2. Define los puntos</h2>
  <div id="pts"></div>
  <button class="ghost" id="addPt">+ Agregar punto</button>

  <h2>3. Conexión a Google Sheets</h2>
  <label for="url">URL de Google Sheets (Apps Script)</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url">
  <label for="country">Código de país / región (Opcional)</label>
  <input id="country" placeholder="co (para Colombia), mx, us, etc." autocapitalize="lowercase">

  <h2>4. ¿Qué punto es este teléfono?</h2>
  <select id="me"></select>
  <button class="big" id="go">Iniciar lector</button>
  <button class="ghost" id="exp" style="width:100%;margin-top:8px">Descargar registro (Excel)</button>
</main>

<section id="run">
  <div class="top"><span class="tag" id="tg"></span><b id="nm"></b><span class="hint" id="pend" style="margin-left:auto"></span></div>
  <div class="cam"><video id="v" playsinline muted></video><div class="guide" id="gd"></div></div>
  <div class="bot">
    <p id="st">Listo para escanear</p>
    <p class="last" id="last"></p>
    <div class="row">
      <button class="ghost" id="snap" style="background:#4cc38a;color:#000;font-weight:bold;flex:2">CAPTURAR Y LEER PLACA</button>
      <button class="ghost" id="stop">Detener</button>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let cfg = ls('cfg_cloud', { token: '', url: '', country: 'co', me: 0, pts: [{ n: 'Entrada principal', t: 'entrada' }, { n: 'Salida principal', t: 'salida' }] });

// ---------- interfaz de configuración ----------
function drawPts() {
  $('pts').innerHTML = '';
  cfg.pts.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pt';
    d.innerHTML = '<input aria-label="Nombre"><select aria-label="Tipo"><option value="entrada">Entrada</option><option value="salida">Salida</option></select><button aria-label="Quitar">×</button>';
    const [n, t, x] = d.children;
    n.value = p.n; t.value = p.t;
    n.oninput = () => { p.n = n.value; refresh(); };
    t.onchange = () => { p.t = t.value; refresh(); };
    x.onclick = () => { if (cfg.pts.length > 1) { cfg.pts.splice(i, 1); drawPts(); refresh(); } };
    $('pts').appendChild(d);
  });
  refresh();
}
function refresh() {
  cfg.token = $('token').value.trim();
  cfg.url = $('url').value.trim();
  cfg.country = $('country').value.trim().toLowerCase();
  const keep = Math.min(cfg.me, cfg.pts.length - 1);
  $('me').innerHTML = cfg.pts.map((p, i) => '<option value="' + i + '">' + (p.n || 'Sin nombre').replace(/</g, '&lt;') + ' (' + p.t + ')</option>').join('');
  $('me').value = keep; cfg.me = keep;
  sv('cfg_cloud', cfg);
}
$('addPt').onclick = () => { cfg.pts.push({ n: 'Punto ' + (cfg.pts.length + 1), t: 'entrada' }); drawPts(); };
$('token').value = cfg.token; $('url').value = cfg.url; $('country').value = cfg.country;
$('token').oninput = $('url').oninput = $('country').oninput = refresh;
$('me').onchange = () => { cfg.me = +$('me').value; sv('cfg_cloud', cfg); };
drawPts();

// ---------- registro y envío ----------
let log = ls('log', []), queue = ls('queue', []);
function register(placa) {
  const p = cfg.pts[cfg.me], row = { t: new Date().toISOString(), p: placa, m: p.t, n: p.n };
  log.unshift(row); log = log.slice(0, 3000); queue.push(row); sv('log', log); sv('queue', queue);
  flush();
}
async function flush() {
  $('pend').textContent = queue.length ? queue.length + ' sin enviar' : '';
  if (!cfg.url || !queue.length || flush.busy) return;
  flush.busy = true;
  const batch = queue.slice();
  try {
    await fetch(cfg.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ rows: batch }) });
    queue = queue.slice(batch.length); sv('queue', queue);
  } catch(e) {}
  flush.busy = false; $('pend').textContent = queue.length ? queue.length + ' sin enviar' : '';
}

// ---------- cámara y consulta a API ----------
let stream = null, isReading = false;

$('go').onclick = async () => {
  refresh();
  if (!cfg.token) { alert('Por favor ingresa tu API Token de Plate Recognizer.'); return; }
  const p = cfg.pts[cfg.me];
  $('tg').textContent = p.t === 'entrada' ? 'Entrada' : 'Salida'; $('tg').className = 'tag ' + p.t; $('nm').textContent = p.n;
  $('setup').style.display = 'none'; $('run').style.display = 'flex';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    $('v').srcObject = stream; await $('v').play();
  } catch(e) { alert('No se pudo acceder a la cámara.'); return; }
};

$('stop').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  $('run').style.display = 'none'; $('setup').style.display = 'block';
};

// Acción al presionar "CAPTURAR Y LEER PLACA"
$('snap').onclick = async () => {
  if (isReading) return;
  isReading = true;
  $('st').textContent = 'Analizando fotograma en la nube…';

  const v = $('v');
  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth; canvas.height = v.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(async (blob) => {
    const formData = new FormData();
    formData.append('upload', blob);
    if (cfg.country) formData.append('regions', cfg.country); // Ej: 'co' para Colombia

    try {
      const res = await fetch('https://api.platerecognizer.com/v1/plate-reader/', {
        method: 'POST',
        headers: {
          'Authorization': 'Token ' + cfg.token
        },
        body: formData
      });

      const data = await res.json();
      if (data.results && data.results.length > 0) {
        const placa = data.results[0].plate.toUpperCase();
        register(placa);
        $('gd').classList.add('ok'); setTimeout(() => $('gd').classList.remove('ok'), 1200);
        if (navigator.vibrate) navigator.vibrate(200);
        $('last').innerHTML = placa + '<small>' + new Date().toLocaleTimeString('es-CO') + '</small>';
        $('st').textContent = '¡Placa detectada con éxito!';
      } else {
        $('st').textContent = 'No se detectó ninguna placa. Intenta de nuevo.';
      }
    } catch(err) {
      $('st').textContent = 'Error de comunicación con el servidor.';
    }
    isReading = false;
  }, 'image/jpeg', 0.85);
};
</script>
</body>
</html>
